---
- name: "[{{ item.key }}] [DEBUG] item to manage"
  ansible.builtin.debug:
    var: item
    verbosity: 2
  tags:
    - install

- name: "[{{ item.key }}] Ensure docker compose project directory exists"
  ansible.builtin.file:
    path: "{{ item.value.compose_file | dirname }}"
    mode: "0750"
    owner: "{{ docker_compose_files_owner }}"
    group: "{{ docker_compose_files_group }}"
    state: directory
  tags:
    - install

- name: "[{{ item.key }}] Check if docker-compose.yml exists"
  ansible.builtin.stat:
    path: "{{ item.value.compose_file }}"
  register: compose_file_stat
  tags:
    - install

- name: "[{{ item.key }}] Create or update docker-compose.yml"
  ansible.builtin.template:
    src: "templates/docker-compose.yml.j2"
    dest: "{{ item.value.compose_file }}"
    owner: "{{ docker_compose_files_owner }}"
    group: "{{ docker_compose_files_group }}"
    mode: "{{ docker_compose_file_mode }}"
  register: compose_template_result
  tags:
    - install

# .env handling: keys live in the inventory (env_files dict or a custom .j2
# per file, in env_file_templates), values come from vault variables.
# Every service gets its OWN named file, ".env_<name>" -- there is no plain
# ".env", so multi-container apps never share secrets across services.
# Never printed / diffed to avoid leaking secrets.
- name: "[{{ item.key }}] Create or update named .env files from env_files"
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ item.value.compose_file | dirname }}/.env_{{ env_file_item.key }}"
    owner: "{{ docker_compose_files_owner }}"
    group: "{{ docker_compose_files_group }}"
    mode: "{{ docker_compose_env_file_mode }}"
  vars:
    env_vars: "{{ env_file_item.value }}"
  loop: "{{ (item.value.env_files | default({})) | dict2items }}"
  loop_control:
    loop_var: env_file_item
    label: "{{ env_file_item.key }}"
  diff: false
  register: env_files_result
  tags:
    - install

- name: "[{{ item.key }}] Create or update named .env files from custom templates"
  ansible.builtin.template:
    src: "{{ env_template_item.value }}"
    dest: "{{ item.value.compose_file | dirname }}/.env_{{ env_template_item.key }}"
    owner: "{{ docker_compose_files_owner }}"
    group: "{{ docker_compose_files_group }}"
    mode: "{{ docker_compose_env_file_mode }}"
  loop: "{{ (item.value.env_file_templates | default({})) | dict2items }}"
  loop_control:
    loop_var: env_template_item
    label: "{{ env_template_item.key }}"
  diff: false
  register: env_templates_result
  tags:
    - install

- name: "[{{ item.key }}] Register whether the project definition changed"
  ansible.builtin.set_fact:
    compose_project_changed: >-
      {{ compose_template_result.changed
         or (env_files_result.results | default([]) | selectattr('changed') | list | length > 0)
         or (env_templates_result.results | default([]) | selectattr('changed') | list | length > 0) }}
  tags:
    - install

- name: "[{{ item.key }}] Stop running service because its definition changed"
  community.docker.docker_compose_v2:
    project_src: "{{ item.value.compose_file | dirname }}"
    project_name: "{{ item.value.project_name | default(omit) }}"
    state: stopped
  when:
    - compose_file_stat.stat.exists
    - compose_project_changed | bool
    - item.value.enabled | default(true)
  tags:
    - install

- name: "[{{ item.key }}] Ensure service is up (recreate if definition changed)"
  community.docker.docker_compose_v2:
    project_src: "{{ item.value.compose_file | dirname }}"
    project_name: "{{ item.value.project_name | default(omit) }}"
    state: present
    pull: "{{ 'always' if compose_project_changed | bool else 'missing' }}"
    recreate: "{{ 'always' if compose_project_changed | bool else 'auto' }}"
  register: compose_install_result
  when:
    - item.value.enabled | default(true)
  tags:
    - install
