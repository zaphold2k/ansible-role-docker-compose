---
# Validate docker / compose and the docker_services variable
- name: Check
  ansible.builtin.include_tasks: check.yml
  tags:
    - always

# Render compose (+ .env) files and make sure enabled services are up
- name: Install docker composes
  ansible.builtin.include_tasks: install.yml
  loop: "{{ docker_services | dict2items }}"
  tags:
    - install

# Pull images and recreate containers when a new image was pulled
- name: Update and restart docker composes
  ansible.builtin.include_tasks: update.yml
  loop: "{{ docker_services | dict2items }}"
  tags:
    - update
    - pull
    - never

# Start/Stop/Restart/Down docker composes
- name: Start/Stop docker composes
  ansible.builtin.include_tasks: manage.yml
  loop: "{{ docker_services | dict2items }}"
  tags:
    - start
    - stop
    - restart
    - down
    - never
