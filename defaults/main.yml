---
docker_compose_base_path: "/opt"

# Dictionary of services to manage. See README.MD for the structure.
docker_services: {}

# Permissions for generated files
docker_compose_file_mode: "0640"
docker_compose_env_file_mode: "0600"

# Owner/group of generated files (compose dir, compose file, .env)
docker_compose_files_owner: "{{ ansible_user | default('root') }}"
docker_compose_files_group: "{{ docker_compose_files_owner }}"
